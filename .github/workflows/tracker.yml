name: Track PS5 prices

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps5-tracker
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          playwright install --with-deps chromium || playwright install chromium || echo "playwright browser install skipped"

      - name: Run collector
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: python collect.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historico.json ultimo_status.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: atualiza preços $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
